<style>

#back:hover{filter:brightness(1.05)}

#side>*{pointer-events:auto}
.card{background:var(--panel);border-radius:18px;padding:13px;box-shadow:0 8px 24px rgba(30,70,120,.14)}
#conn{font-size:12px;color:var(--mute)}#conn .lnk{color:var(--sky);font-weight:700;cursor:pointer;margin-left:4px}#conn code{background:var(--panel2);padding:1px 4px;border-radius:4px}

.row:hover,.row.sel{background:var(--panel2)}

.av:after{content:"";position:absolute;left:8px;right:8px;top:11px;height:3px;border-left:3px solid #2a2e45;border-right:3px solid #2a2e45}
.av.bld:after{display:none}
.rt{flex:1;min-width:0}
.rt b{display:block;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.bd.v{background:#e1f2ff;color:var(--sky)}

.feed div:last-child{border:0}

.feed u{text-decoration:none;color:var(--accent);font-weight:700}

.tb:hover{background:#fff6d6}.tb.on{background:var(--lime);color:#18200a}

const DEFAULT_USER='tigerjk9',DEFAULT_TITLE='닷커넥터의 코드 시티';
function pageUser(){const q=new URLSearchParams(location.search).get('user');if(q)return q;if(location.hostname.endsWith('.github.io'))return location.hostname.split('.')[0];return DEFAULT_USER}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}function lsSet(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}
const GHB={token:'',remain:60,reset:0,lastId:0n,watch:new Map(),runs:new Map(),timers:[]};
function classifyText(s){s=(s||'').toLowerCase();if(/deploy|release|publish|pages|ship|vercel|netlify|firebase|upload/.test(s))return 'ship';if(/test|lint|check|verify|e2e|playwright|cypress|jest|vitest|pytest|typecheck|audit|scan|codeql/.test(s))return 'verify';if(/build|compile|bundle|install|setup|checkout|cache|docker|jekyll/.test(s))return 'build';return null}
async function ghGet(p){if(GHB.remain<3&&Date.now()<GHB.reset)throw new Error('rate');const h={Accept:'application/vnd.github+json'};if(GHB.token)h.Authorization='Bearer '+GHB.token;
 const r=await fetch('https://api.github.com'+p,{headers:h});const rem=r.headers.get('x-ratelimit-remaining');if(rem!=null){GHB.remain=+rem;GHB.reset=(+r.headers.get('x-ratelimit-reset')||0)*1000}if(!r.ok)throw new Error('GitHub '+r.status);return r.json()}
function ghLog(repo,text,kind,t){apply({type:'log',entry:{t:t||Date.now(),repo,text,kind}})}
function ghEvent(e,live){const repo=e.repo&&e.repo.name;if(!repo)return;if(!repos.has(repo))apply({type:'repo',repo:{id:repo,name:repo.split('/').pop(),pushedAt:Date.parse(e.created_at)}});
 const p=e.payload||{},t=Date.parse(e.created_at)||Date.now(),say=(x,k)=>ghLog(repo,x,k,live?Date.now():t);
 if(e.type==='PushEvent'){const br=(p.ref||'').replace('refs/heads/',''),cm=p.commits||[],n=p.size!=null?p.size:cm.length,last=cm[cm.length-1];
  if(new Date(t).toDateString()===new Date().toDateString())stats.pushesToday=(stats.pushesToday||0)+1;
  say('📦 푸시 → '+br+(n?' · 커밋 '+n+'개':'')+(last&&last.message?' · '+last.message.split('\n')[0].slice(0,50):''),'push');
  if(!live)return;apply({type:'repo',repo:{id:repo,pushedAt:Math.max(t,(repos.get(repo)||{}).pushedAt||0)}});apply({type:'stats',stats});apply({type:'fx',fx:{kind:'push',repo,text:br+(n?' +'+n:'')}});
  GHB.watch.set(repo,Date.now()+15*60000);
  if(/^claude\//.test(br)||cm.some(c=>/claude/i.test((c.author&&c.author.name)||'')||/Co-Authored-By: Claude/i.test(c.message||''))){const id='cloud:'+repo+':'+br;
   apply({type:'agent',agent:{id,repo,name:'Claude (클라우드)',kind:'cloud',room:'dev',status:'working',detail:'커밋: '+(last?last.message.split('\n')[0].slice(0,40):'')}});ghLog(repo,'☁ 클라우드 에이전트가 '+br+'에 커밋','cloud');
   setTimeout(()=>agents.has(id)&&apply({type:'agent',agent:{id,room:'ship',detail:'브랜치 '+br+' 푸시'}}),60000);setTimeout(()=>agents.has(id)&&apply({type:'agent',agent:{id,room:'lounge',status:'idle',detail:'다음 지시 대기'}}),180000);setTimeout(()=>apply({type:'agent-remove',id}),600000)}}
 else if(e.type==='PullRequestEvent'){const pr=p.pull_request||{},no=p.number||pr.number;if(p.action==='opened')say('🔀 PR 열림 #'+no+' '+(pr.title||''),'pr');else if(p.action==='closed'&&pr.merged){say('🎉 PR 병합 #'+no+' '+(pr.title||''),'pr');if(live)apply({type:'fx',fx:{kind:'confetti',repo}})}}
 else if(e.type==='ReleaseEvent'){say('🚀 릴리스 '+((p.release&&(p.release.name||p.release.tag_name))||''),'release');if(live)apply({type:'fx',fx:{kind:'rocket',repo}})}
 else if(e.type==='CreateEvent'){if(p.ref_type==='repository')say('🏗 새 저장소','create');else if(p.ref_type==='branch')say('🌿 새 브랜치 '+p.ref,'create')}
 else if(e.type==='ForkEvent'){say('🍴 포크함 → '+((p.forkee&&p.forkee.full_name)||''),'fork');if(live&&p.forkee&&p.forkee.full_name&&!repos.has(p.forkee.full_name))apply({type:'repo',repo:{id:p.forkee.full_name,name:p.forkee.name,fork:true,pushedAt:Date.now(),url:p.forkee.html_url}})}
 else if(e.type==='WatchEvent')say('⭐ 스타 받음','star');else if(e.type==='IssuesEvent'&&p.action==='opened')say('📝 이슈 열림','issue')}
async function ghPollEvents(first){const u=GHB.user;const d=await ghGet('/users/'+u+'/events?per_page=50');const sorted=d.slice().sort((a,b)=>BigInt(a.id)<BigInt(b.id)?-1:1);
 if(first){stats.pushesToday=0;sorted.filter(e=>Date.now()-Date.parse(e.created_at)<48*36e5).forEach(e=>ghEvent(e,false));logs.sort((a,b)=>b.t-a.t);
  sorted.filter(e=>e.type==='PushEvent'&&Date.now()-Date.parse(e.created_at)<15*60000).forEach(e=>GHB.watch.set(e.repo.name,Date.now()+15*60000))}
 else sorted.filter(e=>BigInt(e.id)>GHB.lastId).forEach(e=>ghEvent(e,true));
 sorted.forEach(e=>{if(BigInt(e.id)>GHB.lastId)GHB.lastId=BigInt(e.id)});uiDirty=true}
async function ghPollRuns(){const now=Date.now();const list=[...GHB.watch.entries()].filter(([r,until])=>until>now||[...agents.values()].some(a=>a.kind==='actions'&&a.repo===r&&a.status!=='idle')).slice(0,GHB.token?8:2);
 for(const [repo] of list){try{const d=await ghGet('/repos/'+repo+'/actions/runs?per_page=4');for(const run of d.workflow_runs||[]){const id='gha:'+run.id,prev=GHB.runs.get(run.id),name=run.name||'workflow';
   if(run.status!=='completed'){const room=run.status==='in_progress'?(classifyText(name+' '+(run.display_title||''))||'build'):'plan';apply({type:'agent',agent:{id,repo,name,kind:'actions',room,status:run.status==='in_progress'?'working':'waiting',detail:run.status==='in_progress'?name+' 실행 중':'대기열'}});if(!prev)ghLog(repo,'⚙ 워크플로 시작: '+name,'run');GHB.runs.set(run.id,'running')}
   else if(prev==='running'){GHB.runs.set(run.id,'done');const ok=run.conclusion==='success';apply({type:'agent',agent:ok?{id,repo,name,kind:'actions',room:'lounge',status:'idle',detail:'성공'}:{id,repo,name,kind:'actions',room:'verify',status:'failed',detail:run.conclusion||'실패'}});

function pickVillager(sx,sy){let best=null,bd=1e9;villagers.forEach(v=>{if(v.px==null)return;const q=S(v.px,v.py,9);const d=Math.hypot(sx-q[0],sy-q[1]);if(d<Math.max(9,16*cam.s)&&d<bd){bd=d;best=v}});return best}
const showTip=(sx,sy,html)=>{tip.style.display='block';tip.style.left=Math.min(sx+14,VW-270)+'px';tip.style.top=(sy+14)+'px';tip.innerHTML=html};
function hover(sx,sy){if(trans){tip.style.display='none';return}
 if(view==='town'){const v=pickVac(sx,sy);if(v){hoverBld=null;cv.classList.add('hand');showTip(sx,sy,'<b>🏖 '+esc(v.name)+'</b> 휴가 중<br>'+esc(shortName(v.repo))+' 소속<br><span style="color:#6c7294">새 일이 들어오면 복귀해요 · 눌러서 공장 보기</span>');return}
  const b=pickBuilding(sx,sy);hoverBld=b?b.repo:null;cv.classList.toggle('hand',!!b);
  if(b){const r=repos.get(b.repo),n=busyCount(b.repo);showTip(sx,sy,'<b>'+esc(r.name)+'</b>'+(r.fork?' <span style="color:#9da3c2">· 포크</span>':'')+(r.private?' 🔒':'')+'<br>'+(r.lang?esc(r.lang)+' · ':'')+'마지막 푸시 '+ago(r.pushedAt)+(n?'<br><span style="color:#3ddc84">● 에이전트 '+n+'명 작업 중</span>':'')+'<br><span style="color:#6c7294">눌러서 안으로 들어가기</span>')}
  else{const f=pickFacility(sx,sy);if(f){cv.classList.add('hand');showTip(sx,sy,'<b>'+f.ic+' '+esc(f.n)+'</b><br>'+esc(f.t==='hall'?'오늘의 시정 보고를 볼 수 있어요.':FAC_RULE[f.t]||'')+'<br><span style="color:#4f9a2c">'+esc(facStatus(f))+'</span>')}
   else{const v2=pickVillager(sx,sy);cv.classList.toggle('hand',!!v2);tip.style.display='none'}}}
 else{const a=pickAgent(sx,sy);cv.classList.toggle('hand',!!a);tip.style.display='none'}}
const POKE=['안녕하세요! 👋','앗 깜짝이야!','저 바빠요~ 🏃','오늘 커밋했어요?','사진 찍으세요? 📸','에이전트 타운 최고!','점프! 🦘','간지러워요 ㅋㅋ','고래 봤어요? 🐋'];
function click(sx,sy){if(trans)return;
 if(view==='town'){const v=pickVac(sx,sy);if(v){tip.style.display='none';enterRepo(v.repo);return}const b=pickBuilding(sx,sy);if(b){tip.style.display='none';enterRepo(b.repo);return}
  const f=pickFacility(sx,sy);if(f){selFac=f;uiDirty=true;return}
  const vg=pickVillager(sx,sy);if(vg){vg.jump=performance.now();say(vg,pick(POKE),2400);funStats.pokes=(funStats.pokes||0)+1;return}
  selFac=null;uiDirty=true;const g=groundAt(sx,sy,true);if(g&&!inIsland(g[0],g[1],.8)){if(!whale){spawnWhale(g[0],g[1])}else{for(let i=0;i<10;i++)softP.add(g[0],g[1],SEA_Z+2,.4,[1,1,1,.8]);toast('🐋 고래는 한 번에 한 마리만 놀러 와요')}}}
 else{const cp=S(cat.pos[0],cat.pos[1],6);if(Math.hypot(sx-cp[0],sy-cp[1])<Math.max(18,22*cam.s)){cat.say={text:'냥! 💕',until:performance.now()+2200};funStats.pets++;uiDirty=true;for(let i=0;i<6;i++)parts.push({x:cat.pos[0],y:cat.pos[1],z:12,vx:rand(-.4,.4),vy:rand(-.4,.4),vz:rand(14,24),col:'#ff6fb5',life:1.3,kind:'note',ch:'♥'});return}
  const a=pickAgent(sx,sy);selAgent=a?a.id:null;uiDirty=true}}

/* =========================================================
   낮·노을·밤 + 날씨
   ========================================================= */
let dayMode='auto',weather='clear',rainbow=null;
function dayPhase(){if(dayMode!=='auto')return dayMode;const d=new Date(),h=d.getHours()+d.getMinutes()/60;if(h>=6.5&&h<17.3)return 'day';if((h>=17.3&&h<19.3)||(h>=5.5&&h<6.5))return 'dusk';return 'night'}
const PHASE={day:{ico:'☀️',name:'낮',sun:'#fff1dc',si:2.7,sky:'#dff0ff',gnd:'#a9c98f',hi:1.3,bg:'#95d7f2',sea:'#36b0e6',glow:1,bloom:.12,night:0},
 dusk:{ico:'🌇',name:'노을',sun:'#ffa86c',si:2,sky:'#ffd0bc',gnd:'#7a6a9c',hi:.95,bg:'#d9a3b4',sea:'#5a84cf',glow:2.1,bloom:.5,night:.6},
 night:{ico:'🌙',name:'밤',sun:'#9fb6ff',si:.4,sky:'#34498a',gnd:'#161d38',hi:.48,bg:'#0d1936',sea:'#10295a',glow:3.4,bloom:.95,night:1}};
const WX={clear:{ico:'☀️',name:'맑음'},rain:{ico:'🌧',name:'비'},snow:{ico:'❄️',name:'눈'}};
function wxChip(){const w=WX[weather];return '<div class="st btn" id="wxBtn" title="눌러서 날씨 바꾸기 (맑음·비·눈)">'+w.ico+' <em>'+w.name+'</em></div>'}
function setWeather(w){if(weather==='rain'&&w!=='rain'&&view==='town')rainbow={t0:performance.now(),yaw:cam.yaw};weather=w;
 villagers.forEach(v=>{if(Math.random()<.4)say(v,pick(TOWN_LINES[w==='clear'?'day':w]),2600)});toast(w==='rain'?'🌧 비가 내려요':w==='snow'?'❄️ 눈이 내려요':'☀️ 날이 개었어요'+(rainbow?' · 무지개!':''));uiDirty=true}
const cur={sun:new THREE.Color(),sky:new THREE.Color(),gnd:new THREE.Color(),bg:new THREE.Color(),sea:new THREE.Color(),si:2.6,hi:1.3,glow:1,bloom:.12,night:0,init:false,signK:1};
const _tc=new THREE.Color(),_tc2=new THREE.Color();
function phaseTick(dt){const p=dayPhase(),ph=PHASE[p],k=cur.init?Math.min(1,dt*1.5):1;cur.init=true;const wr=weather==='rain'?1:0,ws=weather==='snow'?1:0;
 const L=(key,hex,mix,m)=>{_tc.set(hex);if(m>0)_tc.lerp(_tc2.set(mix),m);cur[key].lerp(_tc,k)};const N=(key,v)=>{cur[key]+=(v-cur[key])*k};
 L('sun',ph.sun,'#c9d1dd',wr*.6+ws*.35);L('sky',ph.sky,'#aeb8c6',wr*.6+ws*.35);L('gnd',ph.gnd,'#6c7482',wr*.4);
 L('bg',ph.bg,ws?'#dde4ec':'#7f8c9d',(wr*.65+ws*.6)*(1-ph.night*.65));L('sea',ph.sea,ws?'#7fa1bc':'#4d6d84',wr*.55+ws*.45);
 N('si',ph.si*(1-wr*.62-ws*.35));N('hi',ph.hi*(1-wr*.12+ws*.08));N('glow',ph.glow);N('bloom',ph.bloom+wr*.08);N('night',Math.min(1,ph.night+wr*.22));
 sun.color.copy(cur.sun);sun.intensity=cur.si;hemi.color.copy(cur.sky);hemi.groundColor.copy(cur.gnd);hemi.intensity=cur.hi;scene.background.copy(cur.bg);scene.fog.color.copy(cur.bg);water.material.color.copy(cur.sea);
 matG.color.setScalar(cur.glow);bloom.strength=cur.bloom;
 const sk=.92+cur.night*.75;if(Math.abs(sk-cur.signK)>.01){cur.signK=sk;allSigns.forEach(m=>m.material.color.setScalar(sk))}
 let az,el;if(p==='day'){const d=new Date(),h=dayMode==='auto'?d.getHours()+d.getMinutes()/60:13.5;az=1.2+(h-13)*.13;el=clamp(.95-Math.abs(h-13)*.07,.42,.95)}else if(p==='dusk'){az=2.35;el=.27}else{az=.8;el=.95}
 sunDirT.set(Math.cos(el)*Math.cos(az),Math.sin(el),Math.cos(el)*Math.sin(az));sunDir.lerp(sunDirT,k).normalize();
 beam.material.opacity=cur.night;beam.visible=view==='town'&&cur.night>.03}
function sunFollow(){const S2=clamp(cam.dist*.62,16,150),sc=sun.shadow.camera;if(Math.abs(sc.right-S2)>S2*.08){sc.left=-S2;sc.right=S2;sc.top=S2;sc.bottom=-S2;sc.near=10;sc.far=460;sc.updateProjectionMatrix()}
 const st=sc.right*2/2048,tx=Math.round(cam.tx/st)*st,ty=Math.round(cam.ty/st)*st;sun.target.position.set(tx,0,ty);sun.position.set(tx+sunDir.x*220,sunDir.y*220,ty+sunDir.z*220)}
function weatherTick(t,dt){const R=clamp(cam.dist*.55,14,95),H=Math.max(14,cam.dist*.5);rainM.visible=weather==='rain';
 if(weather==='rain'){for(let i=0;i<RAIN;i++){const d=drops[i];d.h-=dt*1.7*d.v;if(d.h<0){d.h+=1;d.x=Math.random();d.y=Math.random()}const x=cam.tx+(d.x*2-1)*R,y=cam.ty+(d.y*2-1)*R,z=d.h*H,j=i*6;rainPos[j]=x;rainPos[j+1]=z;rainPos[j+2]=y;rainPos[j+3]=x+.22;rainPos[j+4]=z+H*.035;rainPos[j+5]=y+.1}rainG.attributes.position.needsUpdate=true}
 else if(weather==='snow'){for(let i=0;i<1300;i++){const d=drops[i];d.h-=dt*.11*d.v;if(d.h<0){d.h+=1;d.x=Math.random();d.y=Math.random()}softP.add(cam.tx+(d.x*2-1)*R+Math.sin(t/900+i)*.5,cam.ty+(d.y*2-1)*R+Math.cos(t/1100+i)*.3,d.h*H/ZS,.14+.1*d.v,[1,1,1,.92])}}}

/* =========================================================
   재미 요소: 투어·사진·알림
   ========================================================= */
let tour=false,tourFocus=null,lastFocusObj=null;
function setTour(on){if(tour===on)return;tour=on;$('tTour').classList.toggle('on',on);if(on)toast('🎬 시네마 투어 · 화면을 끌면 멈춰요')}
function tourTick(t,dt){if(!tour||trans||camAnim)return;const now=performance.now();
 if(view==='town'){const cand=civic.dispatch[civic.dispatch.length-1]||civic.flights[civic.flights.length-1]||couriers[couriers.length-1];
  if(cand&&cand!==lastFocusObj){lastFocusObj=cand;tourFocus={o:cand,until:now+9000}}
  if(!tourFocus&&whale&&whale!==lastFocusObj){lastFocusObj=whale;tourFocus={o:whale,until:now+8000}}}
 let tx,ty,dist;const f=tourFocus&&tourFocus.until>now?tourFocus.o:null;if(!f)tourFocus=null;
 if(f){const x=f.cx!=null?f.cx:f.x,y=f.cy!=null?f.cy:f.y;if(x!=null&&isFinite(x)){tx=x;ty=y;dist=f.cz!=null?46:30}}
 if(tx==null){const fit=view==='town'?fitCam(cityRect()):fitCam(facRect());tx=fit.tx;ty=fit.ty;dist=fit.dist*(.72+.14*Math.sin(t/9000))}
 const k=Math.min(1,dt*.9);cam.tx+=(tx-cam.tx)*k;cam.ty+=(ty-cam.ty)*k;cam.dist+=(dist-cam.dist)*k*.5;
 if(view==='town')cam.yaw+=dt*.07;else cam.yaw+=(Math.PI/4+.5*Math.sin(t/7000)-cam.yaw)*k*.4;cam.pitch+=(.55+.1*Math.sin(t/13000)-cam.pitch)*k*.3}
let toastT=0;function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2600)}
function photo(){try{composer.render();const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;const g=c.getContext('2d');g.drawImage(cv,0,0);g.drawImage(ov,0,0,c.width,c.height);
  const s=c.width/VW;g.font='800 '+Math.round(14*s)+'px '+FONT;g.fillStyle='rgba(255,255,255,.92)';g.textAlign='right';g.fillText('🏙 '+(view==='town'?titleTxt:(repos.get(openRepo)||{}).name||'')+' · '+new Date().toLocaleString('ko-KR'),c.width-16*s,c.height-14*s);
  const a=document.createElement('a');a.download='agent-town-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.png';a.href=c.toDataURL('image/png');a.click();
  const fl=$('flash');fl.style.transition='none';fl.style.opacity='.85';requestAnimationFrame(()=>{fl.style.transition='opacity .5s';fl.style.opacity='0'});toast('📸 사진을 저장했어요')}catch(e){toast('사진 저장에 실패했어요')}}
$('tTour').onclick=()=>setTour(!tour);$('tRotL').onclick=()=>rotateBy(-Math.PI/4);$('tRotR').onclick=()=>rotateBy(Math.PI/4);$('tFw').onclick=fwShow;$('tPhoto').onclick=photo;
$('tWhale').onclick=()=>{if(view!=='town'){toast('🐋 고래는 마을 바다에 살아요');return}if(whale){toast('🐋 고래가 이미 놀고 있어요');return}const p=seaSpot();if(p&&spawnWhale(p[0],p[1])&&!tour)animCam({tx:p[0],ty:p[1],dist:Math.min(cam.dist,48)},900)};

/* =========================================================
   정적 장면 다시 짓기 · 프레임
   ========================================================= */
let townBaseVer=-1,bldSig='',facDirty=true,lastSig=0;
function invalidate(k){if(!k||k==='town'){townBaseVer=-1;bldSig=''}if(!k||k==='factory')facDirty=true}
function rebuild(t){if(townBaseVer!==town.ver){TB.begin();buildTownBase(TB.b);TB.end();townBaseVer=town.ver;bldSig=''}
 if(t-lastSig>400||!bldSig){lastSig=t;const sig=bldSigOf();if(sig!==bldSig){bldSig=sig;TBL.begin();buildTownBld(TBL.b);TBL.end()}}
 if(view==='factory'&&facDirty){FL.begin();drawFacStatic(FL.b);FL.end();facDirty=false}
 townGroup.visible=view==='town';facGroup.visible=view==='factory'}
function resize(){VW=innerWidth;VH=innerHeight;const pr=PRf();renderer.setPixelRatio(pr);renderer.setSize(VW,VH,false);composer.setPixelRatio(pr);composer.setSize(VW,VH);
 const d=DPR();ov.width=Math.round(VW*d);ov.height=Math.round(VH*d);applyCam()}
let lastT=performance.now(),lastUI=0,booted=false;
function frame(t){const dt=Math.min(.05,Math.max(0,(t-lastT)/1000));lastT=t;
 if(camAnim){const k=clamp((t-camAnim.t0)/camAnim.dur,0,1),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,f=camAnim.from,to=camAnim.to;
  cam.tx=f.tx+(to.tx-f.tx)*e;cam.ty=f.ty+(to.ty-f.ty)*e;cam.dist=f.dist*Math.pow(to.dist/f.dist,e);cam.yaw=f.yaw+angD(f.yaw,to.yaw)*e;cam.pitch=f.pitch+(to.pitch-f.pitch)*e;
  if(k>=1){const cb=camAnim.cb;camAnim=null;cb&&cb()}}
 tourTick(t,dt);applyCam();phaseTick(dt);sunFollow();rebuild(t);
 D=DYN.begin();glowP.reset();softP.reset();pools.reset();notes.length=0;
 if(view==='town'){townDynamic(t,dt);const lb=-town.B+1;beam.position.set(lb,45*ZS,lb);beam.rotation.set(0,-t/1400,-.06)}else{skyTick(performance.now(),dt);facDynamic(t,dt)}
 skyCommon(t,dt);updParts(dt);weatherTick(t,dt);
 waterTex.offset.set(t*.000011,t*.000007);
 DYN.end();glowP.end();softP.end();pools.end();
 composer.render();
 const d=DPR();ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,VW,VH);
 if(!trans){if(view==='town')townLabels(t);else facLabels(t);skyLabels(t)}
 if(trans){const k=clamp((t-trans.t0)/(trans.phase===1?500:600),0,1);const al=trans.phase===1?k:1-k;ctx.fillStyle='rgba(255,255,255,'+(al*.92)+')';ctx.fillRect(0,0,VW,VH)}
 if(uiDirty&&t-lastUI>250){renderUI();lastUI=t;uiDirty=false}
 if(!booted){booted=true;const ld=$('loading');ld.classList.add('out');setTimeout(()=>ld.remove(),900)}
 requestAnimationFrame(frame)}

/* =========================================================
   시작
   ========================================================= */
addEventListener('resize',()=>{resize();if(!camAnim&&!tour&&!trans)Object.assign(cam,fitCam(view==='town'?cityRect():facRect()))});
resize();
layoutTown();Object.assign(cam,fitCam(cityRect()));applyCam();
function introCam(){const fit=fitCam(cityRect(),{yaw:Math.PI/4,pitch:.6});fit.dist*=.94;Object.assign(cam,{tx:fit.tx,ty:fit.ty,dist:fit.dist*2.3,yaw:Math.PI/4-1.15,pitch:1.18});animCam(fit,2800)}
connect().then(introCam);
requestAnimationFrame(frame);
window.__town={repos,agents,findPath,SPOTS,SPAWN,blocked,enterRepo,goTown,apply,LIFE,startParty,goVacation,cam,civic,dispatch,flight,spawnWhale,fwShow,setWeather,THREE,scene,camera,renderer,get town(){return town},get view(){return view},set dayMode(v){dayMode=v}};
</script>
