<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>코드 마을 · 에이전트 타운</title>
<style>
:root{--bg:#78d0f2;--panel:rgba(255,255,255,.95);--panel2:#f1f5fb;--line:#e4e9f2;--text:#2a2e45;--mute:#6a7190;--dim:#a0a7bd;--lime:#c6f432;--accent:#4f9a2c;--warn:#e8940b;--bad:#ef4466;--ok:#1fae6c;--sky:#2b8fd6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#cv.drag{cursor:grabbing}#cv.hand{cursor:pointer}
#hdr{position:fixed;left:16px;top:14px;z-index:5;background:var(--panel);border-radius:20px;padding:14px 16px 12px;box-shadow:0 8px 24px rgba(30,70,120,.16);pointer-events:none;max-width:calc(100vw - 380px)}
.brand{font:800 11px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.26em;color:var(--accent);margin-bottom:6px}
.ttl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ttl b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.ttl b:before{content:"🏡";margin-right:8px;font-size:20px}
.ttl span{color:var(--mute);font-size:13px}
#stats{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.st{background:var(--panel2);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;display:flex;gap:6px;align-items:center}
.st i{width:8px;height:8px;border-radius:50%;display:inline-block}
.st em{font-style:normal;color:var(--mute);font-weight:600}
.st.btn{pointer-events:auto;cursor:pointer;background:#fff6d6}.st.btn:hover{background:#ffeaa8}
#back{position:fixed;left:16px;top:150px;z-index:6;display:none;background:#ffcb47;color:#3a2a00;border:0;border-radius:999px;padding:9px 16px;font:800 13px inherit;font-family:inherit;cursor:pointer;box-shadow:0 6px 16px rgba(200,140,0,.3)}
#back:hover{filter:brightness(1.05)}
#side{position:fixed;right:14px;top:14px;bottom:14px;width:316px;z-index:5;display:flex;flex-direction:column;gap:10px;pointer-events:none}
#side>*{pointer-events:auto}
.card{background:var(--panel);border-radius:18px;padding:13px;box-shadow:0 8px 24px rgba(30,70,120,.14)}
#conn{font-size:12px;color:var(--mute)}#conn .lnk{color:var(--sky);font-weight:700;cursor:pointer;margin-left:4px}#conn code{background:var(--panel2);padding:1px 4px;border-radius:4px}
#tokBox{display:none;gap:6px;margin-top:8px}#tokBox input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:12px inherit;font-family:inherit}#tokBox button{border:0;background:var(--lime);border-radius:8px;padding:6px 10px;font:800 12px inherit;font-family:inherit;cursor:pointer}
#conn .dot{width:9px;height:9px;border-radius:50%;background:var(--warn)}
#conn.live .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(31,174,108,.16)}
#conn b{color:var(--text);font-weight:800}
#panel{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
#panel::-webkit-scrollbar{width:6px}#panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.7);border-radius:3px}
h3{margin:0 0 8px;font-size:12.5px;color:var(--text);font-weight:800;display:flex;justify-content:space-between}
h3 small{font-weight:600;color:var(--dim)}
.row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;cursor:pointer}
.row:hover,.row.sel{background:var(--panel2)}
.av{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:15px;position:relative}
.av:after{content:"";position:absolute;left:8px;right:8px;top:11px;height:3px;border-left:3px solid #2a2e45;border-right:3px solid #2a2e45}
.av.bld:after{display:none}
.rt{flex:1;min-width:0}
.rt b{display:block;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt span{display:block;font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;flex:none;background:#eef2f8;color:var(--mute)}
.bd.w{background:#e2f7ec;color:var(--ok)}.bd.q{background:#fff2d6;color:var(--warn)}.bd.x{background:#ffe3e9;color:var(--bad)}.rules div{padding:3px 0;border-bottom:1px dashed #eef1f6}.rules div:last-child{border:0}
.bd.v{background:#e1f2ff;color:var(--sky)}
.feed div{font-size:12px;line-height:1.45;padding:5px 2px;border-bottom:1px dashed #e8edf5;color:#3a3f5a}
.feed div:last-child{border:0}
.feed time{color:var(--dim);font-family:ui-monospace,Menlo,monospace;font-size:11px;margin-right:6px}
.feed u{text-decoration:none;color:var(--accent);font-weight:700}
.repoHead b{font-size:17px;font-weight:800;display:block;word-break:break-all}
.repoHead p{margin:6px 0 8px;font-size:12px;color:var(--mute);line-height:1.5}
.repoHead a{color:var(--sky);font-size:12px;text-decoration:none;font-weight:700}
.det{font-size:12px;color:#3a3f5a;line-height:1.55}
.det .k{color:var(--dim);display:inline-block;width:46px}
.empty{font-size:12px;color:var(--dim);padding:6px 2px;line-height:1.5}
.fun{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.fun span{background:var(--panel2);border-radius:10px;padding:6px 4px;font-size:11.5px;font-weight:700;text-align:center}
.go{margin-top:9px;width:100%;background:#fff6d6;color:#3a2a00;border:0;border-radius:12px;padding:8px;font:800 12px inherit;font-family:inherit;cursor:pointer}.go:hover{background:#ffeaa8}
#ticker{position:fixed;left:16px;bottom:14px;z-index:5;font-size:13px;background:var(--panel);border-radius:999px;padding:8px 14px;max-width:calc(100vw - 380px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 18px rgba(30,70,120,.14)}
#ticker time{color:var(--accent);font-family:ui-monospace,Menlo,monospace;margin-right:8px;font-weight:700}
#hint{position:fixed;right:344px;bottom:18px;font-size:11.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.25);z-index:4}
#tip{position:fixed;z-index:9;pointer-events:none;background:#fff;border-radius:12px;padding:9px 11px;font-size:12px;display:none;max-width:260px;line-height:1.5;box-shadow:0 8px 24px rgba(30,70,120,.2)}
#tip b{font-size:13px}
@media (max-width:760px){
 #side{top:auto;left:10px;right:10px;width:auto;height:36vh}
 #ticker{display:none}#hint{display:none}
 #hdr{max-width:calc(100vw - 32px)}
 .ttl b{font-size:19px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hdr">
 <div class="brand">AGENT TOWN</div>
 <div class="ttl"><b id="ttl">코드 마을</b><span id="sub"></span></div>
 <div id="stats"></div>
</div>
<button id="back">← 마을로 돌아가기</button>
<div id="side">
 <div class="card" id="conn"><div style="display:flex;align-items:center;gap:8px"><span class="dot"></span><span id="connTxt">연결 중…</span><button id="modeBtn" style="display:none"></button></div><div id="tokBox"><input id="tokIn" type="password" placeholder="GitHub 토큰 (선택, 이 브라우저에만 저장)"><button id="tokSave">저장</button></div></div>
 <div id="panel"></div>
</div>
<div id="ticker"></div>
<div id="hint">끌어서 이동 · 휠로 확대 · 두 번 눌러 전체 보기</div>
<div id="tip"></div>
<script>
'use strict';
/* =========================================================
   공통 유틸
   ========================================================= */
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const DPR=()=>Math.min(window.devicePixelRatio||1,2);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function srand(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
 if(f<0){r*=1+f;g*=1+f;b*=1+f}else{r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f}
 return '#'+((1<<24)|(Math.round(r)<<16)|(Math.round(g)<<8)|Math.round(b)).toString(16).slice(1)}
const hhmm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function ago(t){const s=(Date.now()-t)/1000;if(s<60)return '방금';if(s<3600)return Math.floor(s/60)+'분 전';if(s<86400)return Math.floor(s/3600)+'시간 전';if(s<86400*30)return Math.floor(s/86400)+'일 전';if(s<86400*365)return Math.floor(s/86400/30)+'달 전';return Math.floor(s/86400/365)+'년 전'}

/* =========================================================
   아이소메트릭 그리기 기본
   ========================================================= */
const TW=32,TH=16;
const P=(x,y,z=0)=>[(x-y)*TW/2,(x+y)*TH/2-z];
function poly(c,pts,fill,stroke){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath();c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=.6;c.stroke()}}
const EDGE='rgba(0,0,0,.16)';
function box(c,x0,y0,x1,y1,z0,h,col,top){const z1=z0+h;
 if(h>0){poly(c,[P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)],shade(col,-.12),EDGE);
  poly(c,[P(x1,y0,z0),P(x1,y1,z0),P(x1,y1,z1),P(x1,y0,z1)],shade(col,-.28),EDGE)}
 poly(c,[P(x0,y0,z1),P(x1,y0,z1),P(x1,y1,z1),P(x0,y1,z1)],top||col,EDGE)}
function pyramid(c,x0,y0,x1,y1,z0,h,col){const A=P((x0+x1)/2,(y0+y1)/2,z0+h),a=P(x0,y0,z0),b=P(x1,y0,z0),d=P(x1,y1,z0),e=P(x0,y1,z0);
 poly(c,[a,b,A],shade(col,.12));poly(c,[e,a,A],shade(col,.04));poly(c,[e,d,A],shade(col,-.1),EDGE);poly(c,[b,d,A],shade(col,-.26),EDGE)}
const quadY=(c,x0,x1,y,z0,z1,col)=>poly(c,[P(x0,y,z0),P(x1,y,z0),P(x1,y,z1),P(x0,y,z1)],col);
const quadX=(c,x,y0,y1,z0,z1,col)=>poly(c,[P(x,y0,z0),P(x,y1,z0),P(x,y1,z1),P(x,y0,z1)],col);
const flat=(c,x0,y0,x1,y1,z,col,st)=>poly(c,[P(x0,y0,z),P(x1,y0,z),P(x1,y1,z),P(x0,y1,z)],col,st);
function ellipse(c,x,y,rx,col){const p=P(x,y,0);c.beginPath();c.ellipse(p[0],p[1],rx*TW/2,rx*TH/2,0,0,7);c.fillStyle=col;c.fill()}
function tree(c,x,y,kind,sz){sz=sz||1;box(c,x-.08*sz,y-.08*sz,x+.08*sz,y+.08*sz,0,7*sz,'#8a5a3a');
 const col=kind===1?'#ffb3cf':kind===2?'#4fae4a':kind===3?'#6cc95a':kind===4?'#f0a24b':kind===5?'#f2c94c':'#7fd36a';
 box(c,x-.42*sz,y-.42*sz,x+.42*sz,y+.42*sz,7*sz,10*sz,col);box(c,x-.28*sz,y-.28*sz,x+.28*sz,y+.28*sz,17*sz,6*sz,shade(col,.14));
 if(kind===3){[[.2,.43,12],[-.2,.43,14],[.43,-.1,13]].forEach(([a,b,z])=>a<.4?box(c,x+a*sz-.05,y+b*sz-.04,x+a*sz+.05,y+b*sz+.01,z*sz,2,'#ff5d5d'):box(c,x+b*sz-.04,y+a*sz-.05,x+b*sz+.01,y+a*sz+.05,z*sz,2,'#ff5d5d'))}}

/* =========================================================
   상태
   ========================================================= */
const repos=new Map();      // id -> {id,name,fork,private,pushedAt,lang,desc,url,done}
const agents=new Map();     // id -> agent
let logs=[],stats={pushesToday:0},user='',titleTxt='코드 마을',mode='init';
let view='town',openRepo=null,selAgent=null,hoverBld=null,uiDirty=true;
const LANG={JavaScript:'#e9c84a',TypeScript:'#3b7fd4',Python:'#3a74b3',HTML:'#e2603c','Jupyter Notebook':'#e07a2f',CSS:'#7b5bb5',Shell:'#7cc457',Java:'#b07219',Vue:'#41b883',Svelte:'#ff3e00',Go:'#00add8',Rust:'#c26d3e',Kotlin:'#a97bff',Dart:'#00b4ab','C#':'#178600','C++':'#f34b7d'};
const ROOF_FALLBACK=['#d9584a','#3f86d8','#e5a93b','#46a86b','#8a63d2','#e0679b','#2fb3b3','#c9753d'];
function roofColor(r){return r.fork?'#8592ad':(LANG[r.lang]||ROOF_FALLBACK[hash(r.id)%ROOF_FALLBACK.length])}
const AG_COL=['#ff7a59','#4cc3ff','#c6f432','#ffcb47','#b38bff','#ff6fb5','#36d6a0','#ff9f43','#7aa2ff','#f25f5c'];
function repoAgents(id){const out=[];agents.forEach(a=>{if(a.repo===id)out.push(a)});return out}
function busyCount(id){let n=0;agents.forEach(a=>{if(a.repo===id&&(a.status==='working'||a.status==='waiting'))n++});return n}
const shortName=id=>id.split('/').pop();

/* =========================================================
   마을(바깥 층)
   ========================================================= */
const SEA_Z=-8;
const town={R:4,E:19,B:21.2,bld:[],map:new Map(),pieces:[],isl:{},decor:[],lamps:[],free:[],facilities:[],segs:[],roadK:[],seats:[],glints:[],resort:null,ver:0};
const WALLS=['#fff4e6','#ffe8ec','#e6f6ec','#e6f0ff','#f3eaff','#fff8d6','#ffeedd','#e8fbff'];
const OLDW=['#efe2c4','#e8d9bd','#f1e6cf','#e3d5b8'],OLDR=['#a86b4b','#7b8f6a','#8a6a5a','#b07a50','#6f7f99'];
function repoScore(r){return (r.pushedAt||0)-(r.fork?60*864e5:0)}
function lotOrder(R){const out=[];for(let i=-R;i<=R;i++)for(let j=-R;j<=R;j++){if(!i&&!j)continue;out.push([i,j])}
 out.sort((a,b)=>{const ra=Math.max(Math.abs(a[0]),Math.abs(a[1])),rb=Math.max(Math.abs(b[0]),Math.abs(b[1]));if(ra!==rb)return ra-rb;
  const da=Math.abs(a[0])+Math.abs(a[1]),db=Math.abs(b[0])+Math.abs(b[1]);if(da!==db)return da-db;return Math.atan2(a[1],a[0])-Math.atan2(b[1],b[0])});return out}
function inBig(x,y){return town.facilities.some(f=>f.big&&x>f.x0+.6&&x<f.x1-.6&&y>f.y0+.6&&y<f.y1-.6)}
function layoutTown(){
 const all=[...repos.values()].sort((a,b)=>repoScore(b)-repoScore(a)),now=Date.now(),YEAR=365*864e5;
 const cityR=all.filter(r=>!r.fork&&(r.local||now-r.pushedAt<YEAR)),forkR=all.filter(r=>r.fork),oldR=all.filter(r=>!r.fork&&!r.local&&now-r.pushedAt>=YEAR);
 let R=3;while((2*R+1)*(2*R+1)-24<cityR.length+3)R++;town.R=R;const E=town.E=4*R+3,B=town.B=E+2.2;
 town.map.clear();town.bld=[];town.facilities=[];town.decor=[];town.lamps=[];town.free=[];town.ver++;
 const res=new Map();
 [{t:'park',i:-R,j:-R,n:'중앙공원',ic:'🌳'},{t:'fun',i:-R,j:R-1,n:'놀이공원',ic:'🎡'},{t:'stadium',i:R-1,j:R-1,n:'스타디움',ic:'🏟'},{t:'station',i:R-1,j:-R,n:'중앙역',ic:'🚉'}].forEach(f=>{
  for(let a=0;a<2;a++)for(let b=0;b<2;b++)res.set((f.i+a)+','+(f.j+b),f);Object.assign(f,{big:true,x0:4*f.i-2,y0:4*f.j-2,x1:4*f.i+6,y1:4*f.j+6,cx:4*f.i+2,cy:4*f.j+2});town.facilities.push(f)});
 [[2,0,'hospital','병원','🏥'],[0,2,'school','학교','🏫'],[-2,0,'library','도서관','📚'],[0,-2,'fire','소방서','🚒'],[-1,2,'cinema','영화관','🎬'],[2,-1,'police','경찰서','🚓'],[-2,-1,'mall','백화점','🛍']].forEach(([i,j,t,n,ic])=>{
  const f={t,n,ic,cx:4*i,cy:4*j,x0:4*i-2,y0:4*j-2,x1:4*i+2,y1:4*j+2};res.set(i+','+j,f);town.facilities.push(f)});
 const hall={t:'hall',n:'시청',ic:'🏛',cx:0,cy:0,x0:-2,y0:-2,x1:2,y1:2};res.set('0,0',hall);town.facilities.push(hall);
 const lots=lotOrder(R).filter(([i,j])=>!res.has(i+','+j));
 cityR.forEach((r,k)=>{const [i,j]=lots[k];const h=hash(r.id);const kind=k<8?'tower':k<22?'shop':'house',jit=kind==='house';
  const b={repo:r.id,island:'city',kind,rank:k,cx:4*i+(jit?((h>>>4)%5-2)*.1:0),cy:4*j+(jit?((h>>>7)%5-2)*.1:0),tier:k<34?2:3,style:h%3,wall:WALLS[(h>>>9)%WALLS.length],fence:((h>>>12)&3)!==0,garden:((h>>>14)&3)!==0};
  town.bld.push(b);town.map.set(r.id,b)});
 const rnd=srand(hash((user||'town')+R));
 lots.slice(cityR.length).forEach(([i,j])=>{const r=rnd();town.free.push({x:4*i,y:4*j,t:r<.4?'park':r<.55?'pond':r<.75?'play':'forest',seed:Math.floor(rnd()*1e9)})});
 const K=[];for(let k=-R;k<R;k++)K.push(4*k+2);town.roadK=K;const kmax=K[K.length-1];
 town.segs=[];for(const x of K)for(const y of K){if(x+4<=kmax&&!inBig(x+2,y))town.segs.push([x,y,x+4,y]);if(y+4<=kmax&&!inBig(x,y+2))town.segs.push([x,y,x,y+4])}
 town.adj=new Map();town.segs.forEach(([a,b,c2,d])=>{const k1=a+','+b,k2=c2+','+d;(town.adj.get(k1)||town.adj.set(k1,[]).get(k1)).push([c2,d]);(town.adj.get(k2)||town.adj.set(k2,[]).get(k2)).push([a,b])});
 for(const x of K)for(const y of K)if(town.adj.has(x+','+y)&&rnd()<.6){town.decor.push({t:'lamp',x:x+.68,y:y+.68});town.lamps.push([x+.68,y+.68,21])}
 town.segs.forEach(([x0,y0,x1,y1])=>{for(const tt of [.3,.7])if(rnd()<.55){const x=x0+(x1-x0)*tt,y=y0+(y1-y0)*tt;town.decor.push({t:'stree',x:x+(x0===x1?.78:0),y:y+(x0===x1?0:.78)})}});
 // ---- 섬들 ----
 const G=18,isl=town.isl={};
 isl.city={x0:-E,y0:-E,x1:E,y1:E,m:{l:2.2,r:2.2,t:2.2,b:2.2}};
 isl.resort={x0:-12,x1:12,y0:B+G,y1:B+G+13,m:{l:2.2,r:2.2,t:2.2,b:6},name:'🏖 휴양 섬'};
