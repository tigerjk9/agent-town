<style>

.row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;cursor:pointer}
.row:hover,.row.sel{background:var(--panel2)}
.av{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:15px;position:relative}
.av:after{content:"";position:absolute;left:8px;right:8px;top:11px;height:3px;border-left:3px solid #2a2e45;border-right:3px solid #2a2e45}

.feed a{color:inherit;text-decoration:none}.feed a:hover{color:var(--sky);text-decoration:underline}

 #side{top:auto;left:0;right:0;bottom:0;width:auto;height:var(--sh,52px);gap:8px;padding:0 calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));background:rgba(234,241,250,.97);border-radius:20px 20px 0 0;box-shadow:0 -6px 22px rgba(30,70,120,.2);pointer-events:auto;overflow:hidden;transition:height .28s cubic-bezier(.2,.8,.2,1)}
 #sheetH{display:flex;flex:none;align-items:center;gap:8px;height:46px;margin:0 -4px;padding:12px 6px 4px;border:0;background:none;font-weight:800;font-size:13.5px;font-family:inherit;color:var(--text);cursor:pointer;position:relative;touch-action:none}
 #sheetH:before{content:"";position:absolute;left:50%;top:6px;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:#b9c3d6}
 #sheetH span{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

 body.sh1 #sheetH b,body.sh2 #sheetH b{transform:rotate(180deg)}

 #toast{top:auto;bottom:calc(var(--sh,52px) + 66px);left:50%}
 body.sh2 #tools{opacity:0;pointer-events:none}
 body.sh2 #toast{bottom:auto;top:var(--tt,90px)}
 body.shdrag #side,body.shdrag #tools{transition:none}
}
/* 가로 휴대폰: 정보 창은 오른쪽 서랍 */
@media (orientation:landscape) and (max-height:500px){
 #hdr{top:calc(8px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));padding:8px 12px 7px;border-radius:16px;max-width:calc(100vw - var(--sw,0px) - 76px - env(safe-area-inset-left))}
 #side{top:calc(8px + env(safe-area-inset-top));bottom:8px;right:calc(8px + env(safe-area-inset-right));width:290px;gap:8px;transition:transform .28s cubic-bezier(.2,.8,.2,1)}

@media (max-width:760px),(orientation:landscape) and (max-height:500px){

 #stats::-webkit-scrollbar,#tools::-webkit-scrollbar{display:none}

}

/* 지금 화질 단계의 값(아래 '화질 단계'에서 바꾼다). 기본은 예전과 같은 '높음' */

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function srand(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
 if(f<0){r*=1+f;g*=1+f;b*=1+f}else{r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f}
 return '#'+((1<<24)|(Math.round(r)<<16)|(Math.round(g)<<8)|Math.round(b)).toString(16).slice(1)}
const hhmm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function ago(t){const s=(Date.now()-t)/1000;if(s<60)return '방금';if(s<3600)return Math.floor(s/60)+'분 전';if(s<86400)return Math.floor(s/3600)+'시간 전';if(s<86400*30)return Math.floor(s/86400)+'일 전';if(s<86400*365)return Math.floor(s/86400/30)+'달 전';return Math.floor(s/86400/365)+'년 전'}
